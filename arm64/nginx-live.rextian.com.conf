# =============================================================================
#  流媒体管理系统 - Nginx 站点配置（原生 Ubuntu nginx，非宝塔）
#  由 deploy/nginx/live.rextian.com.conf 改写：去掉宝塔 include / QUIC / HTTP3，
#  证书路径沿用 /www/server/panel/vhost/cert（与后台「证书管理」配置一致）
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    listen 51880;
    listen [::]:51880;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 51443 ssl http2;
    listen [::]:51443 ssl http2;
    server_name live.rextian.com live_play.rextian.com live_push.rextian.com i.rextian.com _;
    index index.html;
    root /www/wwwroot/live.rextian.com;
    client_max_body_size 4096m;

    ssl_certificate     /www/server/panel/vhost/cert/live.rextian.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/live.rextian.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 素材上传可达 4GB：请求体不在 Nginx 落盘缓冲而是直接流式转发给后端
        # （浏览器进度条即为后端真实接收进度），并放宽上传/处理超时
        # （内网实测约 9MB/s，4GB 需 ~8 分钟，留足余量）
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /hls-enc/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        expires -1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /hls-key/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /live/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        expires -1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/live.rextian.com.log;
    error_log  /var/log/nginx/live.rextian.com.error.log;
}
