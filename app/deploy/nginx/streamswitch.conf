# =============================================================================
#  流媒体管理系统 - Nginx 站点配置（宝塔面板）
#
#  架构：
#    https://<你的域名>/                -> livems 前端 SPA + 静态资源 (8090)
#    https://<你的域名>/api/            -> livems 后端 API (8090)
#    https://<你的域名>/hls-enc/        -> livems HLS 加密播放代理 (8090)
#    https://<你的域名>/hls-key/        -> livems HLS 密钥下发 (8090)
#    https://<你的域名>/live/...        -> ZLMediaKit 播放分发 (8080)
#    rtmp://<你的域名>/live/...         -> ZLMediaKit RTMP (1935, 四层转发)
#
#  部署：cp deploy/nginx/streamswitch.conf /www/server/panel/vhost/nginx/
#        nginx -t && nginx -s reload
# =============================================================================
server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    listen 8081;
    listen [::]:8081;
    listen [::]:80;
    # 内外网同端口（内网直连与公网映射端口一致）：
    #   51880 = HTTP（内网直接监听，公网映射 51880 -> 51880）
    #   51443 = HTTPS（内网直接监听，公网映射 51443 -> 51443）
    listen 51880;
    listen [::]:51880;
    listen 51443 ssl;
    listen [::]:51443 ssl;
    server_name _;   # 填入你的域名，或保持 _ 匹配任意主机名
    index index.html;
    # root 仅用于 SSL 证书续期验证目录，业务请求全部反代
    root /www/wwwroot/streamswitch;
    # 制播管理支持本地上传视频素材，放宽请求体大小限制
    client_max_body_size 4096m;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/streamswitch.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/streamswitch/*.conf;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/default/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/default/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data on;
    error_page 497  https://$host$request_uri;
    #SSL-END

    # 一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # -------------------------------------------------------------------------
    #  后端 API（livems）
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    #  HLS 加密播放代理 / 密钥下发（livems）
    #  长连接流式响应：关闭缓冲、拉长读超时
    # -------------------------------------------------------------------------
    location /hls-enc/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        expires -1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /hls-key/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    #  ZLMediaKit 播放分发（HTTP-FLV / WS-FLV / HLS）
    #  WS-FLV 需要 WebSocket Upgrade；FLV/HLS 为流式响应需关闭缓冲
    # -------------------------------------------------------------------------
    location /live/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        expires -1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    #  前端 SPA 与静态资源（livems 内置服务，含 NoRoute 回退 index.html）
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log  /www/wwwlogs/streamswitch.log;
    error_log  /www/wwwlogs/streamswitch.error.log;
}
