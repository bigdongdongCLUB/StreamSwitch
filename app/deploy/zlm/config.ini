# =============================================================================
#  ZLMediaKit 配置（流媒体管理系统专用）
#  部署路径：/www/server/zlm
#  启动：cd /www/server/zlm && ./bin/MediaServer -c conf/config.ini
#
#  ⚠️ 重要说明：
#  ZLMediaKit 在启动时如果发现 api.secret 为空或等于内置默认值
#  (035c73f7-bb6b-4889-a715-d9eb2d1925cc)，会自动生成随机 secret 并
#  **重写整个配置文件**（导致本文件中的注释与配置全部丢失）。
#  因此这里必须使用自定义的随机 secret。
#  该 secret 必须与后端 configs/config.yaml 中的 zlm.secret 完全一致。
# =============================================================================

[api]
# 是否调试 http api，开启后会打印每次 http 请求的内容和回复
apiDebug=0
# 敏感 API 的访问密钥，必须与后端 config.yaml 的 zlm.secret 保持一致
secret=CHANGE_ME_zlm_api_secret
# 截图保存路径根目录
snapRoot=./www/snap/
# 默认截图图片
defaultSnap=./www/logo.png
# downloadFile 接口可访问的文件根目录
downloadRoot=./www

[general]
# 服务器唯一ID，用于集群与回调标识
mediaServerId=live_rextian_zlm
# 监听 IP，:: 表示监听所有
listen_ip=::
# 是否开启 vhost
enableVhost=0
# 无人观看时延迟关闭流(毫秒)
streamNoneReaderDelayMS=20000
# 最大流等待时间(毫秒)
maxStreamWaitMS=15000
# 合并写入时间(毫秒)，0=不合并
mergeWriteMS=0
# 重播时是否重置流
resetWhenRePlay=1
# 等待轨道就绪超时(毫秒)
wait_track_ready_ms=10000
# 等待音频轨道数据超时(毫秒)
wait_audio_track_data_ms=1000
# 等待添加轨道超时(毫秒)
wait_add_track_ms=3000
# 未就绪帧缓存数量
unready_frame_cache=100
# 流量上报阈值(KB/s)
flowThreshold=1024
# 帧时间戳覆盖模式：0=源绝对时间戳 1=系统时间戳 2=相对增量
modify_stamp=2

[protocol]
# 转协议开关（决定源流可被哪些协议播放）
enable_hls=1
enable_hls_fmp4=0
enable_mp4=0
enable_rtsp=1
enable_rtmp=1
enable_ts=1
enable_fmp4=1
# 转协议是否开启音频
enable_audio=1
# 关闭音频时是否添加 AAC 静音音频
add_mute_audio=1
# 推流断开后的重连宽限期(毫秒)
continue_push_ms=15000
# 是否直接关闭无人观看的流（1=不触发 on_stream_none_reader 直接关闭）
auto_close=0
# 按需转协议开关，0=首屏秒开体验最佳
hls_demand=0
rtsp_demand=0
rtmp_demand=0
ts_demand=0
fmp4_demand=0
# HLS 切片保存路径（相对可执行文件目录）
hls_save_path=./www

[hls]
# 切片时长(秒)
segDur=2
# 切片数量（内存中保留的切片数）
segNum=3
# 切片延迟(毫秒)
segDelay=0
# 切片保留时长(秒)
segRetain=5
# 切片文件缓冲区大小
fileBufSize=65536
# 删除延迟(秒)
deleteDelaySec=10
# 切片保留数量，0=不额外保留
segKeep=0
# 是否快速注册
fastRegister=0
# fmp4 切片扩展名
fmp4SegExt=.mp4
# 是否在 m3u8 中生成 programDateTime
programDateTime=0

[hook]
# 开启 Hook 回调：推流与播放都需要经过后端鉴权
enable=1
# 推流鉴权/上下线事件
on_publish=http://127.0.0.1:8090/index/hook/on_publish
# 播放鉴权拦截
on_play=http://127.0.0.1:8090/index/hook/on_play
# 流状态变化（上线/下线）
on_stream_changed=http://127.0.0.1:8090/index/hook/on_stream_changed
# 流量上报（观众数/带宽统计）
on_flow_report=http://127.0.0.1:8090/index/hook/on_flow_report
# 流不存在
on_stream_not_found=http://127.0.0.1:8090/index/hook/on_stream_not_found
# 无人观看
on_stream_none_reader=http://127.0.0.1:8090/index/hook/on_stream_none_reader
# 服务启动/退出
on_server_started=http://127.0.0.1:8090/index/hook/on_server_started
on_server_exited=http://127.0.0.1:8090/index/hook/on_server_exited
# 以下回调本项目不使用，保持为空即禁用
on_record_mp4=
on_record_ts=
on_rtsp_auth=
on_rtsp_realm=
on_shell_login=
on_http_access=
on_send_rtp_stopped=
on_rtp_server_timeout=
on_server_keepalive=
# Hook 超时时间(秒)
timeoutSec=10
# Hook 保活间隔(秒)
alive_interval=10.0
# Hook 失败重试次数
retry=1
# Hook 重试间隔(秒)
retry_delay=3.0
# 流状态变化回调所覆盖的协议
stream_changed_schemas=rtsp/rtmp/fmp4/ts/hls/hls.fmp4

[http]
# HTTP 服务端口（本项目的 HTTP-FLV / HLS 由 Nginx 反代到此端口）
port=8080
# HTTPS 端口，0=不启用
sslport=0
# HTTP 文件服务根目录（HLS 切片所在目录）
rootPath=./www
# 字符编码
charSet=utf-8
# KeepAlive 时间(秒)
keepAliveSecond=30
# 请求体最大缓存字节数
maxReqSize=40960
# 文件发送缓冲区大小
sendBufSize=65536
# 是否显示文件夹菜单
dirMenu=0
# 虚拟目录映射
virtualPath=
# 禁止 mmap 缓存的后缀
forbidCacheSuffix=
# 允许跨域的域名列表
allow_origins=*
# 允许访问 http api 和文件索引的 IP 白名单
allow_ip_range=::1,127.0.0.1,172.16.0.0-172.31.255.255,192.168.0.0-192.168.255.255,10.0.0.0-10.255.255.255
# 从反向代理获取真实客户端 IP 的请求头名称（勿暴露）
forwarded_ip_header=

[rtmp]
# RTMP 推流端口（对外发布）
port=1935
sslport=0
# 握手超时(秒)
handshakeSecond=15
# KeepAlive 时间(秒)
keepAliveSecond=15
# 是否直接代理 RTMP
directProxy=1
# 是否开启增强模式
enhanced=1

[rtsp]
# RTSP 端口
port=554
sslport=0
# 握手超时(秒)
handshakeSecond=15
# KeepAlive 时间(秒)
keepAliveSecond=15
# 是否直接代理 RTSP
directProxy=1
# 是否开启 Basic 鉴权
authBasic=0
# 是否低延迟模式
lowLatency=0
# RTP 传输类型
rtpTransportType=-1

[cluster]
# 源拉流失败重试次数，-1 为无限重试
retry_count=3
# 集群源地址
origin_url=
# 集群超时时间(秒)
timeout_sec=15

[ffmpeg]
# ffmpeg 可执行文件路径
bin=/usr/bin/ffmpeg
# 转码命令模板
cmd=%s -re -i %s -c:a aac -strict -2 -ar 44100 -ab 48k -c:v libx264 -f flv %s
# 截图命令模板
snap=%s -i %s -y -f mjpeg -frames:v 1 -an %s
# ffmpeg 日志路径
log=./ffmpeg/ffmpeg.log
# ffmpeg 重启间隔(秒)
restart_sec=0

[record]
# 是否开启 fmp4 录制
enableFmp4=0
# 采样间隔(毫秒)
sampleMS=500
# 快速开始
fastStart=0
# 文件缓冲区大小
fileBufSize=65536

[multicast]
# 组播 TTL
udpTTL=64
# 组播地址范围
addrMin=239.0.0.0
addrMax=239.255.255.255

[rtp]
# RTP 端口
port=10000
# RTP 复用数量
rtpMuxSize=10
# 接收缓冲区大小
recvBufSize=0
# 音频 MTU
audioMtuSize=600
# H264 STAP-A 聚合
h264_stap_a=1
# 低延迟
lowLatency=0
# RTP 最大包大小
rtpMaxSize=10
# 视频 MTU
videoMtuSize=1400

[rtp_proxy]
# GOP 缓存
gop_cache=1
# H264 PT
h264_pt=98
# H265 PT
h265_pt=99
# Opus PT
opus_pt=100
# G711 PCMU PT
ps_pt=96
# G711 PCMA PT
rtp_p711u_pt=8
# RTP 发送缓冲区大小
rtp_send_buf_size=262144
# 端口范围
port_range=30000-35000
# 合并帧
merge_frame=1
# UDP 接收缓冲区大小
udp_recv_socket_buffer=4194304

[srt]
# SRT 端口
port=9000
# SRT 加密口令
passPhrase=
# 延迟倍数
latencyMul=4
# 包缓冲大小
pktBufSize=8192
# 超时时间(秒)
timeoutSec=5

[rtc]
# WebRTC UDP 端口
udpPort=8000
# WebRTC TCP 端口
tcpPort=8000
# 最大观众数
maxReader=10

[shell]
# 是否开启 Shell 调试（生产环境保持关闭）
enable=0
port=0
maxReqSize=1024

[onvif]
# ONVIF 端口
port=3702
